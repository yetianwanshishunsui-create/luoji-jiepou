# 生产部署（单机）：Nginx + 后端 API。
# MySQL / Redis 使用云托管实例（TencentDB / Redis），通过 server.env 中的连接串接入。
# 发布：docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d
services:
  server:
    image: ${SERVER_IMAGE:-luoji/server:latest}
    restart: unless-stopped
    env_file: ./server.env
    environment:
      NODE_ENV: production
      PORT: 3000
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 15s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      # 管理后台静态文件（apps/admin/dist）
      - ./admin-dist:/usr/share/nginx/admin:ro
