# api.example.com → 后端 API（小程序“request 合法域名”必须为已 ICP 备案的 HTTPS 域名）
# admin.example.com → 管理后台静态页 + /admin/v1 反代
# 上线前把 example.com 替换为客户已备案域名，并放置证书到 ./certs

server {
  listen 80;
  server_name api.example.com admin.example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name api.example.com;

  ssl_certificate     /etc/nginx/certs/api.example.com.pem;
  ssl_certificate_key /etc/nginx/certs/api.example.com.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  client_max_body_size 10m;

  location / {
    proxy_pass http://server:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 管理接口只允许从后台域名访问
  location /admin/ {
    return 404;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name admin.example.com;

  ssl_certificate     /etc/nginx/certs/admin.example.com.pem;
  ssl_certificate_key /etc/nginx/certs/admin.example.com.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  root /usr/share/nginx/admin;
  index index.html;

  location /admin/v1/ {
    proxy_pass http://server:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
